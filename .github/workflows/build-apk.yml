name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Version string: $JAVA_VERSION_OUTPUT"
          
          # Extract major version number
          if [[ "$JAVA_VERSION_OUTPUT" =~ \"([0-9]+)(\.|\-) ]]; then
            MAJOR_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VERSION_OUTPUT" =~ \"1\.([0-9]+) ]]; then
            MAJOR_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not detect Java major version from '$JAVA_VERSION_OUTPUT'"
            exit 1
          fi
          
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java version must be 17 or higher. Detected version: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully (Major version: $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create or verify ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "Found expected debug APK at $EXPECTED_APK"
          else
            echo "::warning::Expected APK at $EXPECTED_APK not found or empty. Inspecting app/build/outputs/apk directory..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "::error::Verification failed: Expected debug APK at $EXPECTED_APK does not exist or is empty."
            exit 1
          fi
          
          # Rigorous verification
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have .apk extension."
            exit 1
          fi
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::APK path mismatch: $EXPECTED_APK"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Debug APK verified successfully: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="android-app"
          fi
          
          # Sanitize repository name: replace non-alphanumeric/hyphen/underscore with hyphen
          SANITIZED_NAME=$(echo "$RAW_REPO_NAME" | tr -cs 'a-zA-Z0-9_-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="android-app"
          fi
          
          RELEASE_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"
          
          cp "$SRC_APK" "$DEST_APK"
          
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_APK"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Environment ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is invalid or missing: $ASSET_PATH"
            exit 1
          fi
          
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset is not an APK: $ASSET_PATH"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug Build
          
          - **Build Type**: Automatically generated debug APK
          - **Build System**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Target Branch/Ref**: \`${{ github.ref }}\`
          
          > ⚠️ **Notice**: This APK is signed with a temporary Android debug keystore and is intended for testing and development purposes only. It is not a production release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          echo "=================================================="
          echo "             APK BUILD & RELEASE REPORT           "
          echo "=================================================="
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "✅ GitHub Release published successfully!"
            RELEASE_URL=""
            if command -v gh &> /dev/null; then
              RELEASE_INFO=$(gh release view "$TAG_NAME" --json url,title,tagName 2>/dev/null || true)
              RELEASE_URL=$(echo "$RELEASE_INFO" | grep -o '"url":"[^"]*' | cut -d'"' -f4 || true)
            fi
            
            if [ -z "$RELEASE_URL" ]; then
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            fi
            
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            echo "The APK can be downloaded directly from the GitHub Release Assets section."
            echo "The Actions artifact 'app-debug-apk' is also preserved as a backup."
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 Android Debug APK Build & Release
          
          - **Status**: ✅ Succeeded
          - **Release Title**: Debug APK Build #${{ github.run_number }}
          - **Release Tag**: \`$TAG_NAME\`
          - **Direct Release Download**: [View Release & Download APK]($RELEASE_URL)
          - **Release Asset**: \`$ASSET_NAME\`
          - **Actions Backup Artifact**: \`app-debug-apk\`
          
          You can download the \`.apk\` file directly to your Android device from the release page linked above.
          EOF
          else
            echo "::warning::GitHub Release publishing did not complete successfully or was skipped."
            echo "The APK was successfully compiled and is available as a GitHub Actions artifact."
            echo "Actions Artifact Name: app-debug-apk"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 Android Debug APK Build Report
          
          - **Build Status**: ✅ APK Compiled Successfully
          - **Release Publishing**: ⚠️ Release step did not complete or had a non-fatal warning.
          - **Download Location**: Download the **\`app-debug-apk\`** artifact directly from the **Artifacts** section of this GitHub Actions run summary.
          EOF
          fi
